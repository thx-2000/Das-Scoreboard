<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAGE — Neues Spiel</title>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <a href="#main" class="skip-link">Zum Inhalt springen</a>

  <header class="app-header">
    <div class="app-header__bar">
      <a href="../../index.html" class="app-header__brand">
        <svg class="app-header__logo" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
          <rect x="5" y="4" width="17" height="24" rx="3" stroke="currentColor" stroke-width="2"/>
          <line x1="9" y1="11" x2="18" y2="11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="9" y1="16" x2="18" y2="16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="9" y1="21" x2="14" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M21 8 L27 14 L18.5 22.5 L13.5 23.5 L14.5 18.5 Z" fill="var(--color-green)" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
        <span>Scoreboard</span>
      </a>
      <nav class="app-nav" aria-label="Hauptnavigation">
        <a href="../../index.html" class="btn btn--ghost">Startseite</a>
      </nav>
    </div>
    <h1>RAGE</h1>
    <p class="app-header__subtitle">Neues Spiel einrichten — 10 Runden, Stichansage</p>
    <div class="app-header__accent" aria-hidden="true"></div>
  </header>

  <main id="main">
    <section class="card">
      <h2>Spiel einrichten</h2>
      <p class="hint-text">Feste 10 Runden (10 bis 1 Karte), am Ende gewinnt die höchste Punktzahl.</p>

      <form id="setup-form" class="form">
        <label for="game-label">Bezeichnung (optional)</label>
        <input type="text" id="game-label" placeholder="z.B. RAGE-Abend" maxlength="60" autocomplete="off">

        <label>Wer spielt mit?</label>
        <div class="player-picker" id="player-picker"></div>

        <label for="new-player-inline">Neuen Spieler hinzufügen</label>
        <div style="display:flex; gap:0.5rem;">
          <input type="text" id="new-player-inline" placeholder="Name eingeben" maxlength="40" autocomplete="off" style="flex:1; padding:0.6rem 0.75rem; border-radius:8px; border:1px solid var(--color-border); background:var(--color-bg); color:var(--color-text);">
          <button type="button" id="add-player-inline-btn" class="btn btn--ghost">Hinzufügen</button>
        </div>

        <button type="submit" class="btn btn--primary">Spiel starten</button>
      </form>

      <p id="setup-error" class="error-text" role="alert" hidden></p>
    </section>
  </main>

  <p class="app-version" id="app-version">Scoreboard</p>

  <script src="../../js/version.js"></script>
  <script src="setup.js"></script>
</body>
</html>
